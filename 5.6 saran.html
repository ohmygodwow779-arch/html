<TITLE>การแสดงรายการเรียงลำดับด้วยสัญลักษณ์</TITLE>

<BODY>
<UL TYPE=circle><B>เลือกให้เป็น</B>
    <LI>ถึงยามได้ ได้ให้ดี ไม่มีทุกข์
    <LI>ถึงยามเป็น เป็นให้ถูก ตามวิถี
    <LI>ถึงยามตาย ตายอย่างเป็น เห็นสุดดี
    <LI>ได้อย่างนี้ ไม่มีทุกข์ ทุกเวลา
</UL>
